# Fluxboard local reference environment (docs/10-INFRA-DEVOPS.md §1).
# This base file is PROD-SHAPED: images built from the multi-stage Dockerfile,
# no source mounts. docker-compose.override.yml layers dev conveniences
# (source mount + air hot reload). `make up` merges both.
#
# Run from repo root: docker compose -f deploy/docker-compose.yml \
#   -f deploy/docker-compose.override.yml up

name: fluxboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fluxboard}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-fluxboard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store (ADR-027). MinIO's images are no longer
  # published; RustFS is a MinIO-compatible drop-in, so the app keeps its
  # MINIO_* settings and minio-go client. The `minio` alias keeps existing
  # .env files (MINIO_ENDPOINT=minio:9000) working.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfsdata:/data
    networks:
      default:
        aliases: [minio]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the private bucket and its CORS rules. Browsers PUT/GET
  # attachments straight to presigned URLs, so the web origins must be allowed
  # (real S3 needs the same bucket CORS in production).
  storage-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${MINIO_BUCKET:-fluxboard}
      CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-http://localhost:3000,http://localhost:3100}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        s3="aws --endpoint-url http://rustfs:9000 s3api"
        $$s3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$s3 create-bucket --bucket "$$BUCKET"
        origins=$$(printf '%s' "$$CORS_ORIGINS" | sed 's/,/","/g')
        $$s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$origins\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}"
        echo "bucket $$BUCKET ready (CORS: $$CORS_ORIGINS)"
    restart: "no"

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: api
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file: ../.env
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: worker
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  stripe-cli:
    image: stripe/stripe-cli
    command: ["listen", "--forward-to", "api:8080/api/v1/webhooks/stripe"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - api
    profiles: ["stripe"] # opt-in: needs a real STRIPE_SECRET_KEY

  prometheus:
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  asynqmon:
    image: hibiken/asynqmon
    command: ["--redis-addr=redis:6379"]
    ports:
      - "${ASYNQMON_HOST_PORT:-8082}:8080"
    depends_on:
      redis:
        condition: service_healthy

  # Production web (opt-in daily driver, NOT started by default). The dev
  # override runs `next dev` (2-4s per-route compile stalls); this serves an
  # ahead-of-time build instead. Start with:
  #   docker compose --profile prod up -d --build web-prod
  # then open http://localhost:3100 (same API, same login).
  web-prod:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PROD_HOST_PORT:-3100}:3000"
    depends_on:
      - api
    profiles: ["prod"]

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  grafanadata:
