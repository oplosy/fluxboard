# Alertmanager config template (docs/10-INFRA-DEVOPS.md §5). render.sh fills the
# __PLACEHOLDERS__ from the environment at container start; the SMTP password
# goes to a 0600 file, never into the rendered config.
global:
  smtp_smarthost: "__SMTP_HOST__:__SMTP_PORT__"
  smtp_from: "__SMTP_FROM__"
  smtp_auth_username: "__SMTP_USER__"
  smtp_auth_password_file: /tmp/smtp_password
  smtp_require_tls: __ALERT_SMTP_REQUIRE_TLS__

route:
  receiver: email
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: "__ALERT_EMAIL_TO__"
        send_resolved: true
