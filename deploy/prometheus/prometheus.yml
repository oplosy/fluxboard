# Prometheus scrape config (docs/10-INFRA-DEVOPS.md §5). Targets are compose
# service DNS names on the shared network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: worker
    static_configs:
      - targets: ["worker:8081"]
    metrics_path: /metrics

  # /readyz through the blackbox exporter: probe_success is 0 while the API
  # answers 503 (dependency or schema check failing) or not at all.
  - job_name: readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8080/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
