name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs mirror docs/10-INFRA-DEVOPS.md §4. PRs to main require lint +
# test-backend + build green (branch protection).
env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - name: go-arch-lint (dependency rule)
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.15.0
          go-arch-lint check
      - name: sqlc diff (generated code current)
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin sqlc
          sqlc diff

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # No MinIO service: the test steps export no MINIO_* env, so the store
      # boots nil and attachment paths stay disabled (same as MINIO_ENDPOINT
      # unset locally). (The old bitnami/minio:latest reference died with
      # Bitnami's tag removal, and Actions service containers accept no
      # `command` key for the official image's required `server /data` arg.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: unit tests
        run: go test ./...
      # Same bootstrap as the compose stack: roles from the init script (as the
      # superuser), then migrations as fluxboard_owner. The suite runs as
      # fluxboard_app so RLS is enforced, and fails if the DSN is missing.
      - name: create database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fluxboard -v ON_ERROR_STOP=1 -f ../deploy/postgres/init/01-roles.sql
      - name: migrate
        run: |
          docker run --rm --network host -v "$PWD/migrations":/migrations migrate/migrate:v4.18.3 \
            -path=/migrations \
            -database "postgres://fluxboard_owner:owner_pw@localhost:5432/fluxboard?sslmode=disable" up
      - name: integration tests
        env:
          TEST_DATABASE_URL: postgres://fluxboard_app:app_pw@localhost:5432/fluxboard?sslmode=disable
        run: go test -tags=integration ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          tags: fluxboard-api:sha-${{ github.sha }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}
      - name: build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          tags: fluxboard-worker:sha-${{ github.sha }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history; a shallow clone breaks the scan.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
