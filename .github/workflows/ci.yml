name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs mirror docs/10-INFRA-DEVOPS.md §4. All five are required status checks
# on main's branch protection; renaming a job breaks merging until the
# protection rule is updated (docs/12-TESTING.md §9).
env:
  GO_VERSION: "1.26"
  # Pinned: "latest" resolves at run time, so a new release could fail lint on
  # an unchanged tree. Bump deliberately (and fix what it flags) in its own PR.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
      - name: go-arch-lint (dependency rule)
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.15.0
          go-arch-lint check
      - name: sqlc diff (generated code current)
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin sqlc
          sqlc diff
      - name: alerting config (promtool rules + config, amtool)
        working-directory: deploy
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus" --entrypoint promtool             prom/prometheus:v2.55.1 test rules /etc/prometheus/alerts_test.yml
          docker run --rm -v "$PWD/prometheus:/etc/prometheus" --entrypoint promtool             prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -e APP_ENV=prod -e ALERT_EMAIL_TO=oncall@example.com             -e SMTP_HOST=smtp.example.com -e SMTP_PORT=587 -e SMTP_FROM=alerts@example.com             -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/sh             prom/alertmanager:v0.28.1 /etc/alertmanager/render.sh check

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # S3-compatible store for the object-store integration tests (ADR-027).
      # Same image as compose; its default command needs no `command` key,
      # which Actions service containers cannot set.
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: unit tests
        run: go test ./...
      # Same bootstrap as the compose stack: roles from the init script (as the
      # superuser), then migrations as fluxboard_owner. The suite runs as
      # fluxboard_app so RLS is enforced, and fails if the DSN is missing.
      - name: create database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fluxboard -v ON_ERROR_STOP=1 -f ../deploy/postgres/init/01-roles.sql
      - name: migrate
        run: |
          docker run --rm --network host -v "$PWD/migrations":/migrations migrate/migrate:v4.18.3 \
            -path=/migrations \
            -database "postgres://fluxboard_owner:owner_pw@localhost:5432/fluxboard?sslmode=disable" up
      - name: integration tests
        env:
          TEST_DATABASE_URL: postgres://fluxboard_app:app_pw@localhost:5432/fluxboard?sslmode=disable
          # Owner DSN + Redis: the tenant-isolation suite loads the demo fixture
          # and runs the full API wiring (cmd/api, docs/12-TESTING.md §6).
          TEST_DATABASE_OWNER_URL: postgres://fluxboard_owner:owner_pw@localhost:5432/fluxboard?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          TEST_S3_ENDPOINT: localhost:9000
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_SECRET_KEY: minioadmin
        run: go test -tags=integration ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          tags: fluxboard-api:sha-${{ github.sha }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}
      - name: build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          tags: fluxboard-worker:sha-${{ github.sha }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history; a shallow clone breaks the scan.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
